name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The build still runs so a broken main fails CI, but the app itself is served by
      # Vercel. GitHub Pages only forwards old /statools/ links there.
      - name: Validate release
        run: npm run check

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-redirect
